; Supabase-Zugangsdaten fuer Golf Battle 3D.
; 1) Trage hier deine Project-URL und den oeffentlichen Key ein (Supabase -> Project Settings -> API Keys:
;    "Publishable key" sb_publishable_... oder Legacy "anon public" eyJ...).
; 2) Pushe auf GitHub -> die APK enthaelt die Werte.
; Der anon-Key ist fuer Clients gedacht (Schutz kommt aus den RLS-Policies in supabase_schema.sql).
; NIEMALS den service_role-Key oder einen Secret key (sb_secret_...) eintragen!
; Solange hier die Platzhalter stehen, laeuft das Spiel im Offline-Modus mit Bots.
[supabase]
url="https://pbzrhtgckyuytmjbbvwv.supabase.co"
anon_key="sb_publishable_0UG46h4j2AjqjZMxIUN-gg_L3y1m6G8"

