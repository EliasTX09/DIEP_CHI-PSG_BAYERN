; Supabase-Zugangsdaten fuer Golf Battle 3D.
; 1) Trage hier deine Project-URL und den anon/public Key ein (Supabase -> Project Settings -> API).
; 2) Pushe auf GitHub -> die APK enthaelt die Werte.
; Der anon-Key ist fuer Clients gedacht (Schutz kommt aus den RLS-Policies in supabase_schema.sql).
; NIEMALS den service_role-Key eintragen!
; Solange hier die Platzhalter stehen, laeuft das Spiel im Offline-Modus mit Bots.
[supabase]
url="https://DEIN-PROJEKT.supabase.co"
anon_key="DEIN_ANON_PUBLIC_KEY"

; Web-Portal (GitHub Pages, Ordner webapp/) - Registrieren, Profilbild, Freunde, Spiel-Code.
; Wird beim CI-Build automatisch auf https://<besitzer>.github.io/<repo>/ gesetzt, wenn hier der Platzhalter steht.
[web]
portal_url="https://DEINNAME.github.io/DEIN-REPO/"
