# Veroeffentlicht das Web-Portal (Ordner webapp/) auf GitHub Pages.
# Nur manuell (Actions -> "Web-Portal veroeffentlichen" -> Run workflow), damit eine bestehende
# GitHub-Pages-Seite dieses Repositorys nicht versehentlich ersetzt wird.
# Voraussetzung: Settings -> Pages -> Source: "GitHub Actions".
# Supabase-Zugang: Secrets SUPABASE_URL/SUPABASE_ANON_KEY oder (ohne Secrets) die Werte aus config/backend.cfg.
name: Web-Portal veroeffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase-Zugang in config.js eintragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CFG=config/backend.cfg
          cur() { sed -n "s/^$1=\"\(.*\)\"\s*$/\1/p" "$CFG" | head -n 1; }
          URL="${SUPABASE_URL:-$(cur url)}"
          KEY="${SUPABASE_ANON_KEY:-$(cur anon_key)}"
          if [ -z "$URL" ] || [ -z "$KEY" ] || echo "$URL $KEY" | grep -q "DEIN-PROJEKT\|DEIN_ANON"; then
            echo "::warning::Kein Supabase-Zugang (weder Secrets noch config/backend.cfg) - das Portal zeigt einen Einrichtungs-Hinweis."
          else
            URL="$URL" KEY="$KEY" node -e 'const fs=require("fs");fs.writeFileSync("webapp/config.js","window.GOLF_CONFIG = "+JSON.stringify({supabaseUrl:process.env.URL,anonKey:process.env.KEY})+";\n")'
            if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then echo "Supabase-Zugang aus Secrets."; else echo "Supabase-Zugang aus config/backend.cfg."; fi
          fi
          rm -f webapp/.gdignore
          touch webapp/.nojekyll

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Portal-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
